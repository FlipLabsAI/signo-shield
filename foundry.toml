# Signo Shield — Foundry configuration.
#
# Deliberately dependency-free at the root: a clean clone must build and test
# with nothing but `forge`, no private registry, no Signo database, no env.
# `forge install` additions must be recorded in docs/REUSE.md with their
# licence before they land (FLIP-190).

[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
# Deterministic bytecode across machines: CI and a judge's laptop must agree.
bytecode_hash = "none"
cbor_metadata = false
# Fail the build on anything the compiler flags. A hackathon repo that warns
# on clone reads as unfinished.
deny = "warnings"

[profile.ci]
verbosity = 3
fuzz = { runs = 512 }

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
