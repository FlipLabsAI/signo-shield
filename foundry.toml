# Signo Shield — Foundry configuration.
#
# Deliberately dependency-free at the root: a clean clone must build and test
# with nothing but `forge`, no private registry, no Signo database, no env.
# `forge install` additions must be recorded in docs/REUSE.md with their
# licence before they land (FLIP-190).

[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
# Pinned: "deterministic bytecode" below depends on the EVM target too, and
# forge's default moves between releases. X Layer executes Prague opcodes
# (PUSH0, MCOPY, TSTORE probed on the live node, FLIP-201).
evm_version = "prague"
optimizer = true
optimizer_runs = 200
# Deterministic bytecode across machines: CI and a reviewer's laptop must agree.
# No source hash in the bytecode; the CBOR section stays because it carries
# only the solc version (still deterministic) and forge script needs it to
# find constructor arguments when it broadcasts a deployment.
bytecode_hash = "none"
cbor_metadata = true
# Fail the build on anything the compiler flags. A public repo that warns
# on clone reads as unfinished.
deny = "warnings"

[lint]
# Mandate validity is a timestamp window by design (ERC-8226 uses the same
# `validFrom` / `validUntil` seconds). A validator can nudge a block by seconds,
# not by the days a window spans, so the comparison is the intended check.
exclude_lints = ["block-timestamp"]

[profile.ci]
verbosity = 3
fuzz = { runs = 512 }

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
